services:
  - type: web
    name: uas-backend
    runtime: docker
    dockerContext: Demo_Version
    dockerfilePath: Demo_Version/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: uas-db
          property: connectionString

databases:
  - name: uas-db
    databaseName: uas_db
    user: uas_user
    plan: free
    region: frankfurt
